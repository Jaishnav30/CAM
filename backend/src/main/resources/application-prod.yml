# ==============================================================================
# CAM Production Spring Boot Profile
# Active when SPRING_PROFILES_ACTIVE=prod (e.g. on Render / Railway)
# ==============================================================================
server:
  port: ${PORT:8080}
  servlet:
    context-path: /

spring:
  datasource:
    # Managed PostgreSQL URL (e.g. Supabase connection string)
    url: ${SPRING_DATASOURCE_URL}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    hikari:
      pool-name: CamsProdHikariCP
      maximum-pool-size: 5
      minimum-idle: 2
      idle-timeout: 300000
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false

  flyway:
    enabled: true
    baseline-on-migrate: true
    validate-on-migrate: true

  mail:
    host: ${SPRING_MAIL_HOST:smtp.gmail.com}
    port: ${SPRING_MAIL_PORT:587}
    username: ${SPRING_MAIL_USERNAME:}
    password: ${SPRING_MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          ssl:
            trust: smtp.gmail.com
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

app:
  mail:
    resend-api-key: ${RESEND_API_KEY:}
    brevo-api-key: ${BREVO_API_KEY:}
    from-email: ${CAMS_FROM_EMAIL:${SPRING_MAIL_USERNAME:onboarding@resend.dev}}
    from-name: ${CAMS_FROM_NAME:CAM - Club Accounting & Management}
  security:
    cookie:
      secure: true
      same-site: None
    jwt:
      secret: ${CAMS_JWT_SECRET}
      access-token-expiration-ms: 86400000 # 24 hours (1 day)
      refresh-token-expiration-ms: 604800000 # 7 days
    admin:
      email: ${CAMS_ADMIN_EMAIL:admin@cams.local}
      password: ${CAMS_ADMIN_PASSWORD}

logging:
  level:
    root: INFO
    com.cams: INFO
    org.flywaydb: INFO
    org.hibernate: WARN
